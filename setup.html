<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>翻訳字幕 初期設定</title>
    <link rel="stylesheet" href="setup.css">
    <script src="setup.js" defer></script>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">LOCAL STREAMING TOOL</p>
            <h1>翻訳字幕 初期設定</h1>
            <p>使用する機能と、このPCの接続先を設定します。設定はPC内にのみ保存されます。</p>
        </header>

        <form id="setup-form">
            <section>
                <h2>使用する機能</h2>
                <div class="option-grid">
                    <label><input type="checkbox" data-path="features.speech_recognition"> 音声認識</label>
                    <label><input type="checkbox" data-path="features.deepl_translation"> DeepL翻訳</label>
                    <label><input type="checkbox" data-path="features.show_japanese"> 日本語字幕を表示</label>
                    <label><input type="checkbox" data-path="features.show_english"> 英語字幕を表示</label>
                    <label><input type="checkbox" data-path="features.launch_onecomme"> わんコメを起動</label>
                    <label><input type="checkbox" data-path="features.launch_tanuesa"> TanuEsaを起動</label>
                    <label><input type="checkbox" data-path="features.launch_obs"> OBSを起動</label>
                </div>
            </section>

            <section>
                <div class="section-heading">
                    <h2>音声認識</h2>
                    <button type="button" id="load-microphones" class="secondary">マイク一覧を取得</button>
                </div>
                <label>マイク名（部分一致）<input data-path="speech.microphone_device_name" list="microphones"></label>
                <datalist id="microphones"></datalist>
                <label>マイク番号<input data-path="speech.microphone_device_index" type="number" min="0" placeholder="未指定"></label>
                <div class="field-grid">
                    <label>無音校正（秒）<input data-path="speech.ambient_noise_duration" type="number" min="0" max="30" step="0.1"></label>
                    <label>発話終了待ち（秒）<input data-path="speech.pause_threshold" type="number" min="0.1" max="10" step="0.1"></label>
                    <label>前後の無音（秒）<input data-path="speech.non_speaking_duration" type="number" min="0" max="10" step="0.1"></label>
                    <label>最短発話（秒）<input data-path="speech.phrase_threshold" type="number" min="0" max="10" step="0.1"></label>
                    <label>最大録音（秒）<input data-path="speech.phrase_time_limit" type="number" min="1" max="300" step="1"></label>
                </div>
            </section>

            <section>
                <h2>DeepL</h2>
                <label>認証キー<input data-path="translation.deepl_auth_key" type="password" autocomplete="new-password" placeholder="保存済みのキーは表示しません"></label>
                <p id="key-status" class="hint"></p>
                <label>API URL<input data-path="translation.deepl_api_url" placeholder="空欄ならキーからFree / Proを自動判定"></label>
            </section>

            <section>
                <h2>外部アプリ</h2>
                <label>OBS実行ファイル<input data-path="apps.obs_exe"></label>
                <label>OBSプロファイル<input data-path="apps.obs_profile"></label>
                <label>わんコメ実行ファイル<input data-path="apps.onecomme_exe"></label>
                <label>TanuEsa実行ファイル<input data-path="apps.tanuesa_exe"></label>
            </section>

            <section>
                <div class="section-heading">
                    <div>
                        <h2>追加アプリ</h2>
                        <p class="hint">配信時に一緒に起動したい任意のアプリを追加できます。</p>
                    </div>
                    <button type="button" id="add-custom-app" class="secondary">起動欄を追加</button>
                </div>
                <div id="custom-apps"></div>
            </section>

            <section>
                <h2>ローカルサーバー</h2>
                <div class="field-grid">
                    <label>ホスト<input data-path="server.host" readonly></label>
                    <label>ポート<input data-path="server.port" type="number" min="1" max="65535"></label>
                </div>
            </section>

            <div class="actions">
                <button type="submit">設定を保存</button>
                <a href="/" target="_blank" rel="noopener">翻訳表示を開く</a>
            </div>
            <p id="message" role="status"></p>
        </form>

        <template id="custom-app-template">
            <div class="custom-app-row">
                <div class="custom-app-heading">
                    <label class="custom-enabled"><input type="checkbox" data-custom="enabled"> このアプリを起動</label>
                    <button type="button" class="remove-custom-app danger">削除</button>
                </div>
                <label>表示名<input data-custom="name" placeholder="例: コメント読み上げ"></label>
                <label>実行ファイル<input data-custom="executable" placeholder="C:\\path\\to\\app.exe"></label>
                <label>作業フォルダ<input data-custom="working_directory" placeholder="空欄なら実行ファイルのフォルダ"></label>
                <label>起動引数<input data-custom="arguments" placeholder="必要な場合だけ指定"></label>
            </div>
        </template>
    </main>
</body>
</html>
